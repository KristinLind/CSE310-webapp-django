{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Client</title>

    <link rel="stylesheet" href="{% static 'client_tracker/style.css' %}">
</head>

<body>

    <div class="container">

        <header>
            <h1>Client & Project Tracker</h1>
        </header>

        <main class="card">

            <h2>Update Project Status</h2>

            <div class="details">
                <p><strong>Client Name:</strong> {{ client.name }}</p>
                <p><strong>Project:</strong> {{ client.project }}</p>
                <p><strong>Current Status:</strong> {{ client.status }}</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <p>
                    <label for="status">
                        <strong>New Status:</strong>
                    </label><br>

                    <select id="status" name="status">
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Complete">Complete</option>
                    </select>
                </p>

                <button type="submit">Update Status</button>
            </form>

            <p>
                <a class="secondary-link" href="{% url 'client_detail' client.id %}">
                    ← Cancel and Return to Client
                </a>
            </p>

        </main>

        <footer>
            Client & Project Tracker
        </footer>

    </div>

</body>

</html>
